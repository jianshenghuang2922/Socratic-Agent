# Render Blueprint —— 一键创建免费 Web 服务
#
# 用法：Render 控制台 → New → Blueprint → 选本仓库，Render 会读取本文件自动建服务。
# 之后每次 push 到 master 自动重新部署。
#
# ⚠️ 免费层的限制（务必知情）：
#   - 512MB 内存、无 swap。运行内存吃紧，大仓库分析可能 OOM。
#   - 15 分钟无流量会休眠，下次访问需冷启动（约 30-60 秒）。
#   - 没有 shell 访问，排障只能看日志。
#   若构建阶段 OOM，把 buildCommand 换成带堆上限的版本：
#     NODE_OPTIONS=--max-old-space-size=1536 npm run build

services:
  - type: web
    name: socratic-agent
    runtime: node
    plan: free
    # 新加坡节点离国内最近；若创建时报区域不支持，删掉这一行让 Render 自选
    region: singapore
    branch: master
    # push 到 master 即自动重新部署（这是默认值，显式写出来避免歧义）
    autoDeployTrigger: commit
    # 用 npm install 而非 npm ci：后者要求 package-lock.json 与 package.json 严格一致，
    # 改过 package.json 后容易直接报错中断构建。
    buildCommand: npm install && npm run build
    # 走 scripts/start.mjs —— 它从 PORT 读端口、绑 0.0.0.0，正是云平台需要的
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"

      # 前端必须走真实后端（编译期内联，构建时就要有）
      - key: NEXT_PUBLIC_AGENT_MODE
        value: http

      # ---- LLM 配置 ----
      # ⚠️ 这里的值只在「服务由本 blueprint 管理」时才会同步到 Render。
      #    若服务是手动建的，必须去控制台确认这三个变量，否则改了也不生效。
      - key: LLM_MODEL
        value: inclusionai/ling-3.0-flash-sante:free
      # ⚠️ 必须填你的账号真能调用的模型，否则降级链等于不存在（一路 402，
      #    真实原因还会被「所有模型均调用失败」盖住）。
      #    下面三个是 2026-10-05 实测可用的 :free 模型（免费模型不涉及余额预扣）。
      - key: LLM_FALLBACK_MODELS
        value: nvidia/nemotron-3-super-120b-a12b:free,qwen/qwen3.8-27b:free,apodex/apodex-1.1-mini:free
      - key: LLM_MAX_RETRIES
        value: "3"
      # ⚠️ 推理模型的推理过程同样计入这个预算，给 2500 会稳定截断
      #    （正文为空或 JSON 半截 → 前端报「模型没有返回合法的 JSON」）。
      - key: LLM_MAX_TOKENS
        value: "8000"
      - key: LLM_MAX_TOKENS_CEILING
        value: "16000"

      # ---- 免费试用额度 ----
      # 给没带自己 Key 的访客一小份额度，用完再引导他填自己的 Key。
      # ⚠️ 这两个数字必须和账号自己的上游配额对齐：
      #    OpenRouter 免费档 = 20 请求/分钟 + 50 请求/天（充值满 $10 升到 1000/天）。
      #    一次用户动作可能触发 2~3 次上游调用（查询扩展 + 重试 + 换模型），
      #    所以 50/天大约只够 15~20 次用户动作 —— 全站合计。
      #    账号提额之后，把这两个值同步调大（比如 30 / 300）。
      - key: TRIAL_ENABLED
        value: "1"
      - key: TRIAL_DAILY_LIMIT
        value: "10"
      # 全局上限是护住账号的硬约束 —— 单访客计数认的是服务端下发的 Cookie，
      # 没有 Cookie 的客户端才退回 x-forwarded-for（那个头客户端可伪造），
      # 两者都不能当安全边界。
      - key: TRIAL_GLOBAL_DAILY_LIMIT
        value: "30"

      # ---- 密钥：sync: false 表示不在仓库里存值，由你在 Render 控制台填写 ----
      # ⚠️ 这两项**必须填**，否则上面的免费试用额度等于不存在。
      #    免费额度的存在性前提是「服务端自己持有凭据」：
      #        trialEnabled() = TRIAL_ENABLED && hasServerCredentials()
      #    而 hasServerCredentials() 就是看 OPENAI_API_KEY 有没有值。
      #    没配 → /api/agent/config 返回 llmConfigured:false + trial.available:false
      #    → 首页直接退化成「必须自带 API Key」，现象就像额度功能压根没实现。
      #    （BYOK 仍然可用：用户依旧可在右上角「模型设置」填自己的 Key。）
      #
      #    填法：Render 控制台 → 该服务 → Environment → 编辑这两个变量
      #        OPENAI_API_KEY  = 你的 OpenRouter Key（sk-or-v1-...）
      #        OPENAI_BASE_URL = https://openrouter.ai/api/v1
      #    ⚠️ 这个 Key 会被所有「未自带 Key 的访客」共用，务必配合上面的
      #       TRIAL_DAILY_LIMIT / TRIAL_GLOBAL_DAILY_LIMIT 一起控制成本。
      #    ⚠️ 只有「服务由本 blueprint 管理」时这里的改动才会同步；手动创建
      #       的服务必须直接在控制台 Environment 里改。
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
